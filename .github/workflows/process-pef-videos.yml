name: PEF video transcoding
on:
  workflow_dispatch:
  schedule:
    - cron: '* * * * *'
permissions:
  contents: read
concurrency:
  group: pef-video-processing
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Convert queued videos
        env:
          SUPABASE_URL: ${{ secrets.PEF_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PEF_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python3 scripts/process_pef_videos.py
