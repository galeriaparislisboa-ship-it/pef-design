<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PEF Design — Gallery preview</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#161616}body{margin:0;padding:28px 18px}main{max-width:700px;margin:auto}h1{font-size:32px}p{line-height:1.5;color:#666}.badge{background:#fff3e9;padding:12px;border-radius:12px}.item{display:flex;gap:14px;border-bottom:1px solid #eee;padding:15px 0;align-items:center}.item img{width:86px;height:86px;object-fit:cover;border-radius:12px;background:#eee}.item strong{display:block;margin-bottom:5px}.item small{color:#777}a,button{color:#e41713}button{border:0;background:none;font:inherit;padding:0;cursor:pointer}.item{flex-wrap:wrap}.item>div{flex:1}.edit{margin-left:auto;border:1px solid #ddd;border-radius:12px;padding:9px 15px;color:#161616}.editor{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px 0}.editor label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#555}.editor label.wide{grid-column:1/-1}.editor input,.editor textarea,.editor select{font:inherit;border:1px solid #ddd;border-radius:10px;padding:12px;min-width:0;background:#f4fff4}.editor input:invalid,.editor textarea:invalid{background:#fff0f0}.editor .actions{grid-column:1/-1;display:flex;gap:14px;align-items:center}.editor .save{background:#e41713;color:white;padding:12px 20px;border-radius:12px}.editor .cancel{padding:12px}.editor .feedback{grid-column:1/-1;font-size:13px}.editor textarea{min-height:80px;resize:vertical}@media(max-width:540px){.editor{grid-template-columns:1fr}}.media-editor{width:100%;padding:15px 0;border-top:1px solid #eee}.media-grid{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.media-tile{width:100px;height:110px;position:relative;border:1px solid #ddd;border-radius:13px;overflow:hidden;background:#fafafa}.media-tile img,.media-tile video{width:100%;height:80px;object-fit:cover}.media-tile .remove{position:absolute;right:4px;top:4px;background:white;border-radius:50%;width:25px;height:25px;color:#c00}.media-tile .move{display:flex;justify-content:space-around}.media-tile .move button{font-size:18px;padding:2px 8px}.media-add{width:100px;height:110px;border:1px dashed #aaa;border-radius:13px;display:grid;place-items:center;font-size:35px}.media-save{background:#e41713;color:white;padding:12px 20px;border-radius:12px}.media-message{font-size:13px;color:#555}.media-editor input[type=file]{display:none}</style><main><p><a href="/">← PEF Design</a></p><h1>My gallery</h1><p id="account"></p><p class="badge">You can edit listing details. Media editing is being prepared. Publishing new listings is not enabled yet.</p><div id="status">Checking your session…</div><section id="listings"></section><p><button id="logout">Sign out</button></p></main><script>
const API='https://pef-design-api.galeriaparislisboa.workers.dev',ids={'galeriaparislisboa@gmail.com':'f81528f3-3c3c-4590-9ee9-543f950b6884','ndondina@muchimuchi.fr':'a25a6c44-b649-44ee-aa89-30b2f4832268'},status=document.getElementById('status');
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('pef_cloudflare_session');location.replace('/cloudflare-login.html')};
(async()=>{try{const token=sessionStorage.getItem('pef_cloudflare_session');if(!token)throw Error('Please sign in first.');const auth=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!auth.ok)throw Error('Session expired. Please sign in again.');const user=await auth.json(),sellerId=ids[String(user.email||'').toLowerCase()];if(!sellerId)throw Error('This gallery is not yet enabled in the preview.');document.getElementById('account').textContent=user.email;const response=await fetch(API+'/api/text-listings');if(!response.ok)throw Error('Unable to load listings.');const payload=await response.json(),own=(payload.listings||[]).filter(x=>x.seller_id===sellerId);status.textContent=own.length+' visible listing'+(own.length===1?'':'s');const root=document.getElementById('listings');own.forEach(item=>{const row=document.createElement('article');row.className='item';const img=document.createElement('img'),photos=Array.isArray(item.photos)?item.photos:[],first=photos[0]||((Array.isArray(item.media)?item.media:[]).find(m=>m.type==='photo')||{}).url;if(first&&/^https:\/\//.test(first))img.src=first;img.alt='';const details=document.createElement('div'),title=document.createElement('strong');title.textContent=item.title||'Untitled';const meta=document.createElement('small');meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');details.append(title,meta);row.append(img,details);const edit=document.createElement('button');edit.className='edit';edit.textContent='Edit';edit.type='button';row.append(edit);edit.onclick=()=>{const old=row.querySelector('.editor');if(old){old.remove();edit.textContent='Edit';return}edit.textContent='Close';const form=document.createElement('form');form.className='editor';const fields=[['title','Title',true],['description','Description',false],['price','Price',true],['category','Category',false],['city','City',true],['country','Country',true],['whatsapp','WhatsApp',false]];for(const [key,label,required] of fields){const wrap=document.createElement('label');if(key==='description')wrap.className='wide';wrap.textContent=label;const input=key==='description'?document.createElement('textarea'):document.createElement('input');input.name=key;input.value=item[key]??'';input.required=required;if(key==='title')input.maxLength=120;if(key==='description')input.maxLength=2000;wrap.append(input);form.append(wrap)}const wrap=document.createElement('label');wrap.textContent='Status';const select=document.createElement('select');select.name='listing_status';for(const value of ['available','sold','reserved']){const opt=document.createElement('option');opt.value=value;opt.textContent=value;select.append(opt)}select.value=item.listing_status||'available';wrap.append(select);form.append(wrap);const actions=document.createElement('div');actions.className='actions';const save=document.createElement('button');save.className='save';save.type='submit';save.textContent='Save changes';const cancel=document.createElement('button');cancel.type='button';cancel.className='cancel';cancel.textContent='Cancel';cancel.onclick=()=>{form.remove();edit.textContent='Edit'};actions.append(save,cancel);form.append(actions);const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('role','status');form.append(feedback);form.onsubmit=async event=>{event.preventDefault();if(!form.reportValidity())return;save.disabled=true;save.textContent='Saving…';feedback.textContent='';try{const changes=Object.fromEntries(new FormData(form));const response=await fetch(API+'/api/listings/'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(changes)});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'Unable to save changes ('+response.status+')');Object.assign(item,changes);title.textContent=item.title||'Untitled';meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');feedback.textContent='Changes saved successfully.';setTimeout(()=>{form.remove();edit.textContent='Edit'},900)}catch(error){feedback.textContent=error.message}finally{save.disabled=false;save.textContent='Save changes'}};row.append(form)};const mediaButton=document.createElement('button');mediaButton.className='edit';mediaButton.type='button';mediaButton.textContent='Media';row.append(mediaButton);
mediaButton.onclick=()=>{
 const previous=row.querySelector('.media-editor');if(previous){previous.remove();mediaButton.textContent='Media';return}
 mediaButton.textContent='Close media';
 const panel=document.createElement('section');panel.className='media-editor';
 const heading=document.createElement('strong');heading.textContent='Photos & video';
 const hint=document.createElement('p');hint.textContent='2–5 photos. Optional video (10 seconds maximum), always shown second. Use arrows to reorder photos.';
 const grid=document.createElement('div');grid.className='media-grid';
 const feedback=document.createElement('p');feedback.className='media-message';feedback.setAttribute('role','status');
 const save=document.createElement('button');save.type='button';save.className='media-save';save.textContent='Save media';
 let photos=[...(Array.isArray(item.photos)?item.photos:[])],video=item.video_url||null,busy=false;
 const file=document.createElement('input');file.type='file';file.accept='image/jpeg,image/png,image/webp,video/mp4,video/webm';file.multiple=true;
 function tile(url,type,index){
  const box=document.createElement('div');box.className='media-tile';
  const visual=document.createElement(type==='video'?'video':'img');visual.src=url;if(type==='video'){visual.muted=true;visual.controls=true}visual.alt='';box.append(visual);
  const remove=document.createElement('button');remove.className='remove';remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','Remove '+type);remove.onclick=()=>{if(type==='video')video=null;else photos.splice(index,1);render()};box.append(remove);
  if(type==='photo'){const moves=document.createElement('div');moves.className='move';for(const delta of [-1,1]){const button=document.createElement('button');button.type='button';button.textContent=delta===-1?'←':'→';button.disabled=index+delta<0||index+delta>=photos.length;button.onclick=()=>{const other=index+delta;[photos[index],photos[other]]=[photos[other],photos[index]];render()};moves.append(button)}box.append(moves)}
  return box;
 }
 function render(){grid.replaceChildren();photos.forEach((p,i)=>{grid.append(tile(p,'photo',i));if(i===0&&video)grid.append(tile(video,'video',0))});if(!photos.length&&video)grid.append(tile(video,'video',0));const add=document.createElement('button');add.type='button';add.className='media-add';add.textContent='+';add.setAttribute('aria-label','Add photos or video');add.onclick=()=>file.click();grid.append(add);save.disabled=busy||photos.length<2||photos.length>5}
 file.onchange=async()=>{
  const chosen=[...file.files];file.value='';if(!chosen.length)return;
  if(photos.length+chosen.filter(f=>f.type.startsWith('image/')).length>5){feedback.textContent='Maximum 5 photos.';return}
  if(chosen.filter(f=>f.type.startsWith('video/')).length>1||(video&&chosen.some(f=>f.type.startsWith('video/')))){feedback.textContent='Remove the existing video before adding another.';return}
  busy=true;render();feedback.textContent='Uploading…';
  try{
   for(const f of chosen){
    if(!['image/jpeg','image/png','image/webp','video/mp4','video/webm'].includes(f.type))throw Error('Unsupported format');
    if(f.size>(f.type.startsWith('video/')?35:8)*1024*1024)throw Error('File too large');
    if(f.type.startsWith('video/')){const duration=await new Promise((resolve,reject)=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(u);resolve(v.duration)};v.onerror=()=>{URL.revokeObjectURL(u);reject(Error('Cannot read video'))};v.src=u});if(!Number.isFinite(duration)||duration>10)throw Error('Video must be 10 seconds or shorter')}
    const response=await fetch(API+'/api/listings/'+encodeURIComponent(item.id)+'/upload',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':f.type},body:f});
    const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'Upload failed ('+response.status+')');
    if(f.type.startsWith('image/'))photos.push(result.url);else video=result.url;
   }
   feedback.textContent='Upload complete. Click Save media to apply changes.';
  }catch(e){feedback.textContent=e.message}finally{busy=false;render()}
 };
 save.onclick=async()=>{if(photos.length<2||photos.length>5){feedback.textContent='Select 2–5 photos.';return}busy=true;render();feedback.textContent='Saving…';try{const response=await fetch(API+'/api/listings/'+encodeURIComponent(item.id)+'/media',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({photos,video_url:video})});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'Save failed ('+response.status+')');item.photos=[...photos];item.video_url=video;if(photos[0])img.src=photos[0];feedback.textContent='Media saved successfully.'}catch(e){feedback.textContent=e.message}finally{busy=false;render()}};
 panel.append(heading,hint,grid,file,save,feedback);row.append(panel);render();
};
root.append(row)})}catch(e){status.textContent=e.message;const link=document.createElement('a');link.href='/cloudflare-login.html';link.textContent='Sign in';status.append(' — ',link)}})();
