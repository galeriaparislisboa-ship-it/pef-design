<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PEF Design — Gallery preview</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#161616}body{margin:0;padding:28px 18px}main{max-width:700px;margin:auto}h1{font-size:32px}p{line-height:1.5;color:#666}.badge{background:#fff3e9;padding:12px;border-radius:12px}.item{display:flex;gap:14px;border-bottom:1px solid #eee;padding:15px 0;align-items:center}.item img{width:86px;height:86px;object-fit:cover;border-radius:12px;background:#eee}.item strong{display:block;margin-bottom:5px}.item small{color:#777}a,button{color:#e41713}button{border:0;background:none;font:inherit;padding:0;cursor:pointer}.edit{border:1px solid #ddd;border-radius:10px;padding:9px 14px;margin-top:10px}.editor{padding:16px;border:1px solid #ddd;border-radius:16px;margin:10px 0}.editor label{display:block;font-size:12px;color:#666;margin:12px 0 4px}.editor input,.editor textarea,.editor select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.editor .save{background:#e41713;color:#fff;border-radius:12px;padding:12px 20px;margin-top:14px}.editor .cancel{margin-left:16px}.editor .message{display:block;margin-top:10px;color:#666}</style><main><p><a href="/">← PEF Design</a></p><h1>My gallery</h1><p id="account"></p><p class="badge">Gallery management preview. Publishing and media uploads are not enabled yet.</p><div id="status">Checking your session…</div><section id="listings"></section><p><button id="logout">Sign out</button></p></main><script>
const API='https://pef-design-api.galeriaparislisboa.workers.dev',ids={'galeriaparislisboa@gmail.com':'f81528f3-3c3c-4590-9ee9-543f950b6884','ndondina@muchimuchi.fr':'a25a6c44-b649-44ee-aa89-30b2f4832268'},status=document.getElementById('status');
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('pef_cloudflare_session');location.replace('/cloudflare-login.html')};
(async()=>{try{const token=sessionStorage.getItem('pef_cloudflare_session');if(!token)throw Error('Please sign in first.');const auth=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!auth.ok)throw Error('Session expired. Please sign in again.');const user=await auth.json(),sellerId=ids[String(user.email||'').toLowerCase()];if(!sellerId)throw Error('This gallery is not yet enabled in the preview.');document.getElementById('account').textContent=user.email;const response=await fetch(API+'/api/text-listings');if(!response.ok)throw Error('Unable to load listings.');const payload=await response.json(),own=(payload.listings||[]).filter(x=>x.seller_id===sellerId);status.textContent=own.length+' visible listing'+(own.length===1?'':'s');const root=document.getElementById('listings');own.forEach(item=>{const row=document.createElement('article');row.className='item';const img=document.createElement('img'),photos=Array.isArray(item.photos)?item.photos:[],first=photos[0]||((Array.isArray(item.media)?item.media:[]).find(m=>m.type==='photo')||{}).url;if(first&&/^https:\/\//.test(first))img.src=first;img.alt='';const details=document.createElement('div'),title=document.createElement('strong');title.textContent=item.title||'Untitled';const meta=document.createElement('small');meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');details.append(title,meta);const edit=document.createElement('button');edit.className='edit';edit.textContent='Edit listing';edit.onclick=()=>openEditor(item,row,title,meta);details.append(edit);row.append(img,details);root.append(row)})}catch(e){status.textContent=e.message;const link=document.createElement('a');link.href='/cloudflare-login.html';link.textContent='Sign in';status.append(' — ',link)}})();

function openEditor(item,row,title,meta){
 const previous=row.nextElementSibling;if(previous&&previous.classList.contains('editor')){previous.remove();return}
 const form=document.createElement('form');form.className='editor';
 const fields=[['title','Title','text'],['description','Description','textarea'],['price','Price (€)','number'],['city','City','text'],['country','Country','text'],['category','Category','text'],['whatsapp','WhatsApp','text']];
 const controls={};
 fields.forEach(([key,label,type])=>{const l=document.createElement('label');l.textContent=label;const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;if(type==='number'){input.min='0';input.step='0.01'}input.value=item[key]??'';input.required=true;l.append(input);form.append(l);controls[key]=input});
 const label=document.createElement('label');label.textContent='Status';const select=document.createElement('select');['available','reserved','sold'].forEach(v=>{const opt=document.createElement('option');opt.value=v;opt.textContent=v;select.append(opt)});select.value=['available','reserved','sold'].includes(item.listing_status)?item.listing_status:'available';label.append(select);form.append(label);controls.listing_status=select;
 const save=document.createElement('button');save.type='submit';save.className='save';save.textContent='Save changes';const cancel=document.createElement('button');cancel.type='button';cancel.className='cancel';cancel.textContent='Cancel';cancel.onclick=()=>form.remove();const message=document.createElement('small');message.className='message';message.setAttribute('role','status');form.append(save,cancel,message);row.after(form);
 form.onsubmit=async event=>{event.preventDefault();save.disabled=true;message.textContent='Saving…';const changes={};for(const [key,input] of Object.entries(controls)){const value=key==='price'?Number(input.value):input.value.trim();if(value!==(item[key]??''))changes[key]=value}
 if(!Object.keys(changes).length){message.textContent='No changes';save.disabled=false;return}
 try{const token=sessionStorage.getItem('pef_cloudflare_session');if(!token)throw Error('Session expired');const response=await fetch(API+'/api/listings/'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(changes)});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Update failed');Object.assign(item,changes);title.textContent=item.title;meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');message.textContent='Saved successfully';setTimeout(()=>form.remove(),800)}catch(e){message.textContent=e.message+'. Changes were not saved.'}finally{save.disabled=false}};
}
</script></html>
