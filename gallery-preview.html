<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PEF Design — Gallery preview</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#161616}body{margin:0;padding:28px 18px}main{max-width:700px;margin:auto}h1{font-size:32px}p{line-height:1.5;color:#666}.badge{background:#fff3e9;padding:12px;border-radius:12px}.item{display:flex;gap:14px;border-bottom:1px solid #eee;padding:15px 0;align-items:center}.item img{width:86px;height:86px;object-fit:cover;border-radius:12px;background:#eee}.item strong{display:block;margin-bottom:5px}.item small{color:#777}a,button{color:#e41713}button{border:0;background:none;font:inherit;padding:0;cursor:pointer}.item{flex-wrap:wrap}.item>div{flex:1}.edit{margin-left:auto;border:1px solid #ddd;border-radius:12px;padding:9px 15px;color:#161616}.editor{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px 0}.editor label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#555}.editor label.wide{grid-column:1/-1}.editor input,.editor textarea,.editor select{font:inherit;border:1px solid #ddd;border-radius:10px;padding:12px;min-width:0;background:#f4fff4}.editor input:invalid,.editor textarea:invalid{background:#fff0f0}.editor .actions{grid-column:1/-1;display:flex;gap:14px;align-items:center}.editor .save{background:#e41713;color:white;padding:12px 20px;border-radius:12px}.editor .cancel{padding:12px}.editor .feedback{grid-column:1/-1;font-size:13px}.editor textarea{min-height:80px;resize:vertical}@media(max-width:540px){.editor{grid-template-columns:1fr}}</style><main><p><a href="/">← PEF Design</a></p><h1>My gallery</h1><p id="account"></p><p class="badge">You can edit listing details. Media uploads and publishing are not enabled yet.</p><div id="status">Checking your session…</div><section id="listings"></section><p><button id="logout">Sign out</button></p></main><script>
const API='https://pef-design-api.galeriaparislisboa.workers.dev',ids={'galeriaparislisboa@gmail.com':'f81528f3-3c3c-4590-9ee9-543f950b6884','ndondina@muchimuchi.fr':'a25a6c44-b649-44ee-aa89-30b2f4832268'},status=document.getElementById('status');
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('pef_cloudflare_session');location.replace('/cloudflare-login.html')};
(async()=>{try{const token=sessionStorage.getItem('pef_cloudflare_session');if(!token)throw Error('Please sign in first.');const auth=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!auth.ok)throw Error('Session expired. Please sign in again.');const user=await auth.json(),sellerId=ids[String(user.email||'').toLowerCase()];if(!sellerId)throw Error('This gallery is not yet enabled in the preview.');document.getElementById('account').textContent=user.email;const response=await fetch(API+'/api/text-listings');if(!response.ok)throw Error('Unable to load listings.');const payload=await response.json(),own=(payload.listings||[]).filter(x=>x.seller_id===sellerId);status.textContent=own.length+' visible listing'+(own.length===1?'':'s');const root=document.getElementById('listings');own.forEach(item=>{const row=document.createElement('article');row.className='item';const img=document.createElement('img'),photos=Array.isArray(item.photos)?item.photos:[],first=photos[0]||((Array.isArray(item.media)?item.media:[]).find(m=>m.type==='photo')||{}).url;if(first&&/^https:\/\//.test(first))img.src=first;img.alt='';const details=document.createElement('div'),title=document.createElement('strong');title.textContent=item.title||'Untitled';const meta=document.createElement('small');meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');details.append(title,meta);row.append(img,details);const edit=document.createElement('button');edit.className='edit';edit.textContent='Edit';edit.type='button';row.append(edit);edit.onclick=()=>{const old=row.querySelector('.editor');if(old){old.remove();edit.textContent='Edit';return}edit.textContent='Close';const form=document.createElement('form');form.className='editor';const fields=[['title','Title',true],['description','Description',false],['price','Price',true],['category','Category',false],['city','City',true],['country','Country',true],['whatsapp','WhatsApp',false]];for(const [key,label,required] of fields){const wrap=document.createElement('label');if(key==='description')wrap.className='wide';wrap.textContent=label;const input=key==='description'?document.createElement('textarea'):document.createElement('input');input.name=key;input.value=item[key]??'';input.required=required;if(key==='title')input.maxLength=120;if(key==='description')input.maxLength=2000;wrap.append(input);form.append(wrap)}const wrap=document.createElement('label');wrap.textContent='Status';const select=document.createElement('select');select.name='listing_status';for(const value of ['available','sold','reserved']){const opt=document.createElement('option');opt.value=value;opt.textContent=value;select.append(opt)}select.value=item.listing_status||'available';wrap.append(select);form.append(wrap);const actions=document.createElement('div');actions.className='actions';const save=document.createElement('button');save.className='save';save.type='submit';save.textContent='Save changes';const cancel=document.createElement('button');cancel.type='button';cancel.className='cancel';cancel.textContent='Cancel';cancel.onclick=()=>{form.remove();edit.textContent='Edit'};actions.append(save,cancel);form.append(actions);const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('role','status');form.append(feedback);form.onsubmit=async event=>{event.preventDefault();if(!form.reportValidity())return;save.disabled=true;save.textContent='Saving…';feedback.textContent='';try{const changes=Object.fromEntries(new FormData(form));const response=await fetch(API+'/api/listings/'+encodeURIComponent(item.id),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(changes)});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(result.error||'Unable to save changes ('+response.status+')');Object.assign(item,changes);title.textContent=item.title||'Untitled';meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');feedback.textContent='Changes saved successfully.';setTimeout(()=>{form.remove();edit.textContent='Edit'},900)}catch(error){feedback.textContent=error.message}finally{save.disabled=false;save.textContent='Save changes'}};row.append(form)};root.append(row)})}catch(e){status.textContent=e.message;const link=document.createElement('a');link.href='/cloudflare-login.html';link.textContent='Sign in';status.append(' — ',link)}})();
