<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PEF Design — Gallery preview</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#161616}body{margin:0;padding:28px 18px}main{max-width:700px;margin:auto}h1{font-size:32px}p{line-height:1.5;color:#666}.badge{background:#fff3e9;padding:12px;border-radius:12px}.item{display:flex;gap:14px;border-bottom:1px solid #eee;padding:15px 0;align-items:center}.item img{width:86px;height:86px;object-fit:cover;border-radius:12px;background:#eee}.item strong{display:block;margin-bottom:5px}.item small{color:#777}a,button{color:#e41713}button{border:0;background:none;font:inherit;padding:0;cursor:pointer}</style><main><p><a href="/">← PEF Design</a></p><h1>My gallery</h1><p id="account"></p><p class="badge">Read-only preview. Editing and publishing are not enabled yet.</p><div id="status">Checking your session…</div><section id="listings"></section><p><button id="logout">Sign out</button></p></main><script>
const API='https://pef-design-api.galeriaparislisboa.workers.dev',ids={'galeriaparislisboa@gmail.com':'f81528f3-3c3c-4590-9ee9-543f950b6884','ndondina@muchimuchi.fr':'a25a6c44-b649-44ee-aa89-30b2f4832268'},status=document.getElementById('status');
document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('pef_cloudflare_session');location.replace('/cloudflare-login.html')};
(async()=>{try{const token=sessionStorage.getItem('pef_cloudflare_session');if(!token)throw Error('Please sign in first.');const auth=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!auth.ok)throw Error('Session expired. Please sign in again.');const user=await auth.json(),sellerId=ids[String(user.email||'').toLowerCase()];if(!sellerId)throw Error('This gallery is not yet enabled in the preview.');document.getElementById('account').textContent=user.email;const response=await fetch(API+'/api/text-listings');if(!response.ok)throw Error('Unable to load listings.');const payload=await response.json(),own=(payload.listings||[]).filter(x=>x.seller_id===sellerId);status.textContent=own.length+' visible listing'+(own.length===1?'':'s');const root=document.getElementById('listings');own.forEach(item=>{const row=document.createElement('article');row.className='item';const img=document.createElement('img'),photos=Array.isArray(item.photos)?item.photos:[],first=photos[0]||((Array.isArray(item.media)?item.media:[]).find(m=>m.type==='photo')||{}).url;if(first&&/^https:\/\//.test(first))img.src=first;img.alt='';const details=document.createElement('div'),title=document.createElement('strong');title.textContent=item.title||'Untitled';const meta=document.createElement('small');meta.textContent=[item.city,item.country,item.listing_status].filter(Boolean).join(' · ');details.append(title,meta);row.append(img,details);root.append(row)})}catch(e){status.textContent=e.message;const link=document.createElement('a');link.href='/cloudflare-login.html';link.textContent='Sign in';status.append(' — ',link)}})();
</script></html>
