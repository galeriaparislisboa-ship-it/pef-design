<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEF Design</title><style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto}.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,520px);z-index:4;display:flex;justify-content:space-between;align-items:center;padding:14px;background:#111c}.logo{display:flex;flex-direction:column;align-items:stretch;justify-content:center;font-family:Helvetica,Arial,sans-serif;line-height:1}.logo span{display:block;white-space:nowrap}.logo .logo-pef{font-size:30px;font-weight:800;letter-spacing:-.055em}.logo .logo-design{font-size:14px;font-weight:300;letter-spacing:.015em;margin-top:2px;text-align:center}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.item{height:100dvh;scroll-snap-align:start;position:relative;background:linear-gradient(140deg,#272727,#555);display:flex;align-items:center;justify-content:center}.item video{width:100%;height:100%;object-fit:cover}.placeholder{font-size:90px}.caption{position:absolute;bottom:95px;left:20px;right:85px;text-shadow:0 1px 4px #000}.caption h2{margin:0 0 8px}.side{position:absolute;bottom:125px;right:14px;display:grid;gap:18px}.side button{border:0;border-radius:50%;width:53px;height:53px;background:#ffffffd9;font-size:24px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);background:#141414;display:flex;justify-content:space-around;padding:14px;z-index:4}.nav button,.top button{background:none;color:white;border:0}.screen{padding:90px 20px 95px;min-height:100dvh}.hidden{display:none}input{width:100%;padding:13px;margin:8px 0 16px;border-radius:8px;border:1px solid #bbb}.primary{padding:14px;background:white;border:0;border-radius:8px;width:100%;font-weight:bold}.card{background:#242424;border-radius:12px;padding:16px;margin:14px 0}.muted{color:#aaa;font-size:13px}a{color:white}
</style></head><body><div class="app"><header class="top"><button onclick="show('feed')">←</button><span class="logo" aria-label="PEF Design"><span class="logo-pef">PEF</span><span class="logo-design">Design</span></span><button onclick="show('profile')">Profil</button></header>
<main id="feed" class="feed"></main><section id="create" class="screen hidden"><h1>Publier un objet</h1><p class="muted">Vidéo verticale de 10 secondes maximum</p><label>Vidéo<input id="video" type="file" accept="video/*"></label><label>Nom de l'objet<input id="name" placeholder="Ex. Lampe vintage"></label><label>Prix (€)<input id="price" type="number" placeholder="250"></label><label>Ville<input id="city" placeholder="Lisbonne"></label><label>WhatsApp vendeur (avec indicatif)<input id="phone" placeholder="+351..."></label><button class="primary" onclick="publish()">Publier la fiche</button><p class="muted">Version de démonstration : les annonces sont conservées uniquement sur cet appareil pendant la session.</p></section>
<section id="profile" class="screen hidden"><h1>Profil vendeur</h1><p>Mes objets et statistiques</p><div id="stats"></div></section><section id="favorites" class="screen hidden"><h1>Favoris</h1><div id="favlist"></div></section>
<nav class="nav"><button onclick="show('feed')">Accueil</button><button onclick="show('favorites')">♡ Favoris</button><button onclick="show('create')">＋ Publier</button><button onclick="show('profile')">Profil</button></nav></div>
<script>
const items=[{name:'Fauteuil vintage',price:380,city:'Lisbonne',emoji:'🪑',views:0,likes:0},{name:'Lampe design',price:190,city:'Paris',emoji:'💡',views:0,likes:0},{name:'Vase en céramique',price:85,city:'Lisbonne',emoji:'🏺',views:0,likes:0}],favs=new Set();
function show(id){for(const el of document.querySelectorAll('main,section'))el.classList.add('hidden');document.getElementById(id).classList.remove('hidden');if(id==='profile')stats();if(id==='favorites')favorites();if(id==='feed')render()}
function render(){document.getElementById('feed').innerHTML=items.map((x,i)=>`<article class="item">${x.url?`<video src="${x.url}" muted playsinline loop autoplay></video>`:`<div class="placeholder">${x.emoji}</div>`}<div class="caption"><h2>${escapeHTML(x.name)}</h2><p>${escapeHTML(x.city)} · ${escapeHTML(String(x.price))} €</p></div><div class="side"><button onclick="like(${i})">${favs.has(i)?'♥':'♡'}</button><button onclick="contact(${i})">✆</button></div></article>`).join('');items.forEach(x=>x.views++)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function like(i){favs.has(i)?favs.delete(i):(favs.add(i),items[i].likes++);render()}
function contact(i){const x=items[i];if(!x.phone)return alert('Contact WhatsApp disponible sur les annonces publiées avec un numéro vendeur.');window.open('https://wa.me/'+x.phone.replace(/\D/g,'')+'?text='+encodeURIComponent('Bonjour, votre objet '+x.name+' sur PEF est-il disponible ?'),'_blank','noopener')}
function publish(){const file=document.getElementById('video').files[0],name=document.getElementById('name').value.trim(),price=document.getElementById('price').value,city=document.getElementById('city').value.trim(),phone=document.getElementById('phone').value.trim();if(!file||!name||!price||!city||!phone)return alert('Complète tous les champs.');const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{if(v.duration>10.5){URL.revokeObjectURL(v.src);return alert('La vidéo doit durer 10 secondes maximum.')}items.unshift({name,price,city,phone,url:v.src,views:0,likes:0});show('feed')};v.src=URL.createObjectURL(file)}
function stats(){document.getElementById('stats').innerHTML=items.map(x=>`<div class="card"><strong>${escapeHTML(x.name)}</strong><p>👁 ${x.views} vues · ♥ ${x.likes} favoris</p></div>`).join('')}
function favorites(){document.getElementById('favlist').innerHTML=[...favs].map(i=>`<div class="card">${escapeHTML(items[i]?.name||'')}</div>`).join('')||'<p>Aucun favori pour le moment.</p>'}render();
</script></body></html>
